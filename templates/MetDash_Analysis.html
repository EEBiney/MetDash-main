<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetDash</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        html {
            interpolate-size: allow-keywords;
        }

        body {
            background-image: url("https://www.creative-proteomics.com/blog/wp-content/uploads/2024/01/plant-metabolomics-techniques-applications-and-phytochemical-insights.jpg");
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
        }

        nav {
            width: fit-content;
            margin: 0rem auto;
            margin-right: calc(100% - 70%);

            padding: 10px;
            /*   background: black; */
            border-radius: 8px;

            @supports (corner-shape: squircle) {
                border-radius: 24px;
                border-shape: squircle;
            }

            ul:has(:not(:hover)) {
                anchor-name: --test;
            }

            &::before {
                z-index: -2;
                background-attachment: fixed;
                background-image: url("https://www.creative-proteomics.com/blog/wp-content/uploads/2024/01/plant-metabolomics-techniques-applications-and-phytochemical-insights.jpg");
            }

            &::after {
                backdrop-filter: blur(2px);
                background-color: hsl(200 100% 100% / 0.1);
                z-index: -1;
            }

            & > ul {
                position: relative;

                &::after {
                content: "";
                position: absolute;
                z-index: -3;
                inset: -8px;
                border-radius: 8px;

                @supports (corner-shape: squircle) {
                    border-radius: 24px;
                    border-shape: squircle;
                }
                background: hsl(0 0% 0% / 0.8);
                backdrop-filter: blur(2px);
                }
            }

            &::before,
            &::after {
                content: "";
                border-radius: 8px;

                position-anchor: --test;
                position: absolute;
                top: calc(anchor(bottom) - 4px);
                left: calc(anchor(left) + 1rem);
                right: calc(anchor(right) + 1rem);
                bottom: anchor(bottom);

                transition: 500ms;
                transition-timing-function: linear(
                0,
                0.008 1.1%,
                0.031 2.2%,
                0.129 4.8%,
                0.257 7.2%,
                0.671 14.2%,
                0.789 16.5%,
                0.881 18.6%,
                0.957 20.7%,
                1.019 22.9%,
                1.063 25.1%,
                1.094 27.4%,
                1.114 30.7%,
                1.112 34.5%,
                1.018 49.9%,
                0.99 59.1%,
                1
                );
            }

            &:has(a:hover)::before,
            &:has(a:hover)::after {
                @supports (corner-shape: squircle) {
                corner-shape: squircle;
                border-radius: 50%;
                }
                top: anchor(top);
                left: anchor(left);
                right: anchor(right);
            }

            &:has(li:first-of-type a:hover)::before,
            &:has(li:first-of-type a:hover)::after {
                @supports (corner-shape: squircle) {
                border-radius: 32px 50% 50% 32px;
                }
            }

            &:has(li:last-of-type a:hover)::before,
            &:has(li:last-of-type a:hover)::after {
                @supports (corner-shape: squircle) {
                border-radius: 50% 32px 32px 50%;
                }
            }

            > ul {
                padding: 0;
                margin: 0;
                list-style: none;
                display: flex;
            }

            a {
                display: block;
                padding: 1rem;
                text-decoration: none;
                color: white;

                &:hover {
                position: relative;
                display: block;
                anchor-name: --test;
                }
            }
        }

        html {
            color-scheme: dark;
        }

        body {
            font-family: system-ui;
            font-size: 1rem;
        }

        .top-bar {
            background-color: rgb(249, 246, 246);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }

        .top-bar img {
            height: auto;
        }

        .top-bar h1 {
            font-size: 30px;
            color: rgb(5, 4, 4);
            margin: 0 20px;
            flex-grow: 1;
        }

        input[type=text] {
            width: 150px;
            box-sizing:border-box;
            border: 2px solid #0a0101;
            border-radius: 15px;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.658);
            background-image: url('searchicon.png');
            background-position: 10px 10px; 
            background-repeat: no-repeat;
            padding: 6px 10px 6px 20px;
            -webkit-transition: width 0.4s ease-in-out;
            transition: width 0.4s ease-in-out;
        }

        input[type=text]:focus {
            width: 100%;
        }

        .container {
            margin-top: 150px; /* Adjusted for fixed top bar*/
            padding: 20px;
            background-color: rgba(172, 159, 159, 0);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0);
            width: fit-content;
            height: fit-content;
            display:flex;
            flex-wrap: wrap;
            gap: 50px;
            justify-content: center;
        }

        /*.Description {
            text-align: center;
            padding: 20px;
            background-color: rgba(255, 249, 249, 0);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.034);
            width: 400px;
            text-align: center;
            margin-left: 10px;
            margin-top: 10px;
            height: fit-content;
        }
        
        .Description summary {
            cursor: pointer;
            font-weight: bold;
            font-size: 1.2em;
            margin-bottom: 10px;
        }*/

        .Submission_Container1 {
            text-align: center;
            padding: 20px;
            background-color: rgba(1, 1, 1, 0.505);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.034);
            width: 500px;
            text-align: center;
            margin-left: 10px;
            margin-top: 10px;
            height: 400px;
        }

        .Submission_Container2 {
            text-align: center;
            padding: 20px;
            background-color: rgba(1, 1, 1, 0.505);
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.034);
            width: 500px;
            text-align: center;
            margin-left: 10px;
            margin-top: 10px;
            height: 400px;
        }

        .footer {
            margin-top: calc(100% - 85%);
            background-color: rgb(248, 244, 244);
            text-align: center;
            color: rgb(4, 4, 4);
            font-size: 12px;
            position: relative;
            bottom: auto;
            display: inline-block;
            width: 100%;
        }

        .footer img {
            position: inherit;
            margin-top: 10px;
            margin-bottom: 10px;
        }

    </style>
</head>
<body>
    <div class="top-bar">
        <!--- <img src="/static/images/Lab_logo_2.png" alt="Obatalab Logo" width="180" height="100"> --->
        <h1>MetDash</h1>
        <nav>
        <ul>
            <li><a href="/home">Home</a></li>
            <li><a href="/analysis">Analysis</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/blog">Blog</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
        </nav>
        <form>
            <input type="text" name="search" placeholder="Search...">
        </form>
    </div>

    <div class="container">
        <!--- <details class="Description">
            <summary><h2 style="color: rgb(255, 255, 255);">Analysis Description</h2></summary>
            <p style="color: rgb(251, 252, 249);">Welcome to the MetDash project! This platform is designed to streamline the analysis of metabolomics data, providing a user-friendly interface for researchers to upload and analyze their raw metabolite height data.</p>
            <p style="color: rgb(251, 252, 249);">To get started, please upload your raw metabolite height data after using QTOF quantitation software. The data will be processed to generate insights into metabolite levels, which can be crucial for understanding various biological processes.</p>
            <p style="color: rgb(251, 252, 249);">For any questions or support, please refer to the documentation or contact our support team.</p>
        </details> --->
        

        <div class="Submission_Container1">
            <h2 style="color: rgb(255, 255, 255);">Pre-Data Analysis</h2><br>
            
            <form action="/upload" method="POST" enctype="multipart/form-data" class="mt-4">
                <div class="mb-3">
                    <label for="fileInput" class="form-label" style="color: rgb(250, 250, 252);">Upload Raw Metabolite Data (CSV):</label>
                    <input type="file" class="form-control" id="dataInput" name="data" value="CSV file" accept=".csv" required>
                    <br>
                </div>

                <div class="mb-3">
                    <label for="fileInput" class="form-label" style="color: rgb(250, 250, 252);">Upload Sample Info (TXT):</label>
                    <input type="file" class="form-control" id="sampleInput" name="sample" value="txt file" accept=".txt" required>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>

        <div class="Submission_Container2">
            <h2 style="color: rgb(255, 255, 255);">Post-Data Analysis</h2><br>
            
            <form action="/upload" method="POST" enctype="multipart/form-data" class="mt-4">
                
                <div class>
                    <label for="project_name" class="form-label" style="color: rgb(250, 250, 252);">Project Name:</label>
                    <input type="dropdown" id="dropdown" class="form-control" name="dropdown" value="" placeholder="Enter Project Name" required><br>

                    <select id="Treatment" class="form-control" name="treatment-type" required>
                        <option value="" disabled selected>Select Treatment Column</option>
                        <option value="Type1">Column1</option>
                        <option value="Type2">Column2</option>
                        <option value="Type3">Column3</option>
                        <option value="Type4">Column4</option>
                        <option value="Type5">Column5</option>
                    </select><br>

                </div>

                <div class="mb-3">
                    <label for="fileInput" class="form-label" style="color: rgb(250, 250, 252);">Upload Pre-Data Results (CSV):</label>
                    <input type="file" class="form-control" id="dataInput2" name="data2" value="CSV file" accept=".csv" required>
                </div>

                <button type="submit" class="btn btn-primary">Submit</button>
            </form>
        </div>
    </div>

    <div class="footer">
        <img src="/static/images/Lab_logo_2.png" alt="Obatalab Logo" width="180" height="100">
        <p>
            Terms of Use | Privacy Policy | US Privacy Notice<br>
            Trademarks of Obatalab. 2025 Obatalab
        </p>
    </div>

<script>
    document.querySelector('.Submission_Container1 form').addEventListener('submit', function(e) {
        e.preventDefault();

        const form = this;
        const formData = new FormData(form);
        const btn = form.querySelector('button[type="submit"]');

        btn.disabled = true;
        btn.textContent = 'Processing...';

        fetch('/upload', {
            method: 'POST',
            body: formData
        })
        .then(response => {
            if (!response.ok) throw new Error('Processing failed');
            return response.blob();
        })
        .then(blob => {
            // Get filename from uploaded file
            const dataFile = form.querySelector('#dataInput').files[0];
            const baseName = dataFile ? dataFile.name.replace(/\.[^/.]+$/, '') : 'results';
        
            // Trigger the zip download
            const url = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = baseName + '_bundle.zip';
            document.body.appendChild(a);
            a.click();
            a.remove();
            window.URL.revokeObjectURL(url);
        
            // Clear the form
            form.reset();
            btn.disabled = false;
            btn.textContent = 'Submit';
        });
    });
</script>

</body>
</html>
