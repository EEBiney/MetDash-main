<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MetDash</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome CDN -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">

    <style>
        html {
            interpolate-size: allow-keywords;
        }
    
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
    
        body {
            background-image: url("https://www.creative-proteomics.com/blog/wp-content/uploads/2024/01/plant-metabolomics-techniques-applications-and-phytochemical-insights.jpg");
            background-attachment: fixed;
            background-size: cover;
            background-repeat: no-repeat;
            font-family: system-ui;
            font-size: 1rem;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
    
        /* TOP BAR */
        .top-bar {
            background-color: rgb(249, 246, 246);
            padding: 10px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
        }
    
        .top-bar h1 {
            font-size: 24px;
            color: rgb(5, 4, 4);
            margin: 0;
        }
    
        /* NAV */
        nav {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 2;
        }
    
        nav > ul {
            padding: 6px;
            margin: 0;
            list-style: none;
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            background: hsl(0 0% 0% / 0.8);
            border-radius: 8px;
        }
    
        nav a {
            display: block;
            padding: 0.5rem 0.75rem;
            text-decoration: none;
            color: white;
            font-size: 0.9rem;
        }
    
        nav a:hover {
            background-color: rgba(255, 255, 255, 0.15);
            border-radius: 6px;
        }
    
        /* SEARCH */
        input[type=text] {
            width: 120px;
            border: 2px solid #0a0101;
            border-radius: 15px;
            font-size: 14px;
            background-color: rgba(255, 255, 255, 0.658);
            padding: 6px 10px;
            transition: width 0.4s ease-in-out;
        }
    
        input[type=text]:focus {
            width: 180px;
            outline: none;
        }
    
        /* MAIN CONTAINER */
        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;              /* was 'auto' which is invalid */
            justify-content: center;
            padding: 20px;
            margin-top: 120px;
            margin-bottom: 20px;
            flex: 1;                /* pushes footer down */
            align-content: flex-start;
        }
    
        /* CARDS */
        .card-custom1,
        .card-custom2,
        .card-custom3,
        .card-custom4 {
            padding: 20px;
            text-align: center;
            width: 100%;            /* was 200% which causes overflow */
            max-width: 300px;
            height: fit-content;
            border-radius: 8px;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
        }
    
        .card-custom1 { background-color: #e904047e; }
        .card-custom2 { background-color: #107a0c99; }
        .card-custom3 { background-color: #1c0c7a98; }
        .card-custom4 { background-color: #f9f9fa9e; }
    
        /* FOOTER */
        .footer {
            background-color: rgb(248, 244, 244);
            text-align: center;
            color: rgb(4, 4, 4);
            font-size: 12px;
            width: 100%;
            margin-top: auto;
            padding: 10px 0;
        }
    
        .footer img {
            margin: 10px 0;
            max-width: 150px;
            height: auto;
        }
    
        /* MOBILE BREAKPOINT */
        @media (max-width: 600px) {
            .top-bar {
                flex-direction: column;
                align-items: flex-start;
                padding: 10px;
            }
    
            .top-bar h1 {
                font-size: 20px;
            }
    
            nav > ul {
                flex-wrap: wrap;
            }
    
            nav a {
                padding: 0.4rem 0.6rem;
                font-size: 0.8rem;
            }
    
            input[type=text] {
                width: 100%;
            }
    
            input[type=text]:focus {
                width: 100%;
            }
    
            .container {
                margin-top: 160px;
                padding: 10px;
                gap: 15px;
            }
    
            .card-custom1,
            .card-custom2,
            .card-custom3,
            .card-custom4 {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <!--- <img src="/static/images/Lab_logo_2.png" alt="Obatalab Logo" width="180" height="100"> --->
        <h1>MetDash</h1>
        <nav>
        <ul>
            <li><a href="/">Home</a></li>
            <li><a href="/analysis">Analysis</a></li>
            <li><a href="/about">About</a></li>
            <li><a href="/blog">Blog</a></li>
            <li><a href="/contact">Contact</a></li>
        </ul>
        </nav>
        <form>
            <input type="text" name="search" placeholder="Search...">
        </form>
    </div>

    <section class="container">
        <div class="card-custom1">
            <img src="/static/images/me.jpg" alt="Emmanuel" width="200" height="200"> 
            <h3 style="color: white;">Emmanuel E. Biney</h3>
            <p style="color: white;">Email: ebiney2@huskers.unl.edu eebineys@gmailcom</p>
            <p style="color: white;">Role: Lead Developer <br>
                Plant Biochemist</p>
        </div>

        <div class="card-custom2">
    
        </div>

        <div class="card-custom3">
            
        </div>

        <div class="card-custom4">
            
        </div>        

    </section>   

    <div class="footer">
        <img src="/static/images/Lab_logo_2.png" alt="Obatalab Logo" width="180" height="100">
        <p>
            Terms of Use | Privacy Policy | US Privacy Notice<br>
            Trademarks of Obatalab and its affiliated companies. 2025 Obatalab
        </p>
    </div>

</body>
</html>
